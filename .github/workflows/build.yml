name: ci

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version of the browser to build.
        required: true
        type: string

env:
  TAGS_FMT: ${{ inputs.tag == 'nightly' && '{0}/browser:latest,{0}/browser:{1}' || '{0}/browser:{1}' }}

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PAT }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: cloud:v0.30.1-desktop.2
          driver: cloud
          endpoint: "lightpanda/lightpanda-browser"
          install: true
          platforms: linux/amd64,linux/arm64
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64,linux/arm64
          no-cache: true
          tags: "${{ format(env.TAGS_FMT, vars.DOCKER_USER, inputs.tag) }}"
          outputs: "type=registry"
          build-args: TAG=${{ inputs.tag }}
